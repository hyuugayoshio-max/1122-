const CLOCK = '14:53';
const LOCK_DATE = '10月15日(木)';
const PARTNER = '芝育秋';
const SENTENCE = '';   // s22は文字入力なし

  let h = '';
  for (const g of LOG){
    h += `<div class="sep"><span>${esc(g.label)}</span></div>`;
    for (const [who, time, text, read] of g.msgs){
      const bub = text === '__STAMP__' ? `<div class="stamp">${STAMP}</div>` : `<div class="bub">${TAIL}${String(text).split('／').map(esc).join('<br>')}</div>`;
      if (who === 't') h += `<div class="row o" data-time="${time}"><div class="av" style="background-image:url('${AVATAR}')"></div><div class="ln2">${bub}<div class="tmo"><span>${esc(time)}</span></div></div></div>`;
      else h += `<div class="row s" data-time="${time}"><div class="ln2"><div class="tmw">${read === false ? '' : CHECK}<span>${esc(time)}</span></div>${bub}</div></div>`;
    }
  }
  list.innerHTML = h;
}
buildChat();
const toBottom = () => { list.scrollTop = list.scrollHeight; requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; }); };

/* ---- サイズ（--u ＝ 画面幅/390 px）※HANAトーク画面と同じ仕組み ---- */
function layout(){
  const iw = window.innerWidth, ih = window.innerHeight;
  let g = 0;
  if (touch) {
    phone.style.width = ''; phone.style.height = '';
    const R = phone.getBoundingClientRect().height;
    W = iw; H = R || ih;
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    if (standalone && iw <= ih && R) {
      const d = screen.height - R;
      if (d > 8 && d < 120) g = d;
    }
  } else {
    W = Math.min(iw, ih * 390 / 844); H = W * 844 / 390;
    phone.style.width = W + 'px'; phone.style.height = H + 'px';
    phone.style.left = ((iw - W) / 2) + 'px'; phone.style.top = ((ih - H) / 2) + 'px';
  }
  GAP = g;
  U = W / 390;
  phone.style.setProperty('--u', U + 'px');
  phone.style.setProperty('--g', g + 'px');
  paintGap();
}
/* 画面下の帯（描けない部分）の色を、表示中の画面の一番下の色に合わせる */
function paintGap(){
  let col = '';
  if (touch && GAP > 0) col = state === 'lock' ? '#5a9ad6' : (phone.classList.contains('kb') ? '#d1d4da' : '#ffffff');
  document.documentElement.style.backgroundColor = col;
  document.body.style.backgroundColor = col;
}

/* ---- ① 待ち受け → トーク ---- */
lock.addEventListener('click', () => {
  if (state !== 'lock') return;
  lock.classList.add('gone'); state = 'chat'; paintGap();
});

/* ---- 打ち込み ---- */
const CHARS = Array.from(SENTENCE);
let idx = 0, sent = false;
function renderInput(){
  const t = CHARS.slice(0, idx).join('');
  if (t){ ftext.innerHTML = `<span class="t">${esc(t)}</span><span class="cur"></span>`; cin.classList.add('has'); }
  else  { ftext.innerHTML = `<span class="cur"></span><span>メッセージ</span>`; cin.classList.remove('has'); }
}
function flash(k){
  const el = document.querySelector(`.k[data-k="${k}"]`);
  if (!el) return;
  el.classList.add('pressed'); clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('pressed'), 140);
}
function typeNext(){
  if (sent || idx >= CHARS.length) return;
  flash(KEYMAP[CHARS[idx++]]);
  renderInput();
}
function delOne(){ if (sent || idx <= 0) return; idx--; renderInput(); }
function send(){
  if (sent || idx === 0) return;
  const msg = ['m', CLOCK, CHARS.slice(0, idx).join(''), false];   // 送った直後は未読
  LOG[LOG.length - 1].msgs.push(msg);
  sent = true; idx = 0;
  buildChat(); renderInput(); toBottom();
  if (READ_AFTER_SEND) setTimeout(() => { msg[3] = true; buildChat(); toBottom(); }, READ_DELAY_MS);
}
function openKb(){
  if (phone.classList.contains('kb')) return;
  phone.classList.add('kb'); paintGap(); toBottom();
}

// キーボード
$('kb').addEventListener('pointerdown', e => {
  const k = e.target.closest('.k');
  if (!k) return;
  e.preventDefault();
  if (k.dataset.act === 'del'){ flash('del'); delOne(); }
  else if (k.dataset.act === 'send'){ flash('enter'); send(); }
  else typeNext();
});
// 入力欄
cin.addEventListener('pointerdown', e => { e.preventDefault(); });   // s22は文字入力なし
// トーク部分：スクロールではなくタップのときだけ1文字
let tp = null;
list.addEventListener('pointerdown', e => { tp = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() }; });
list.addEventListener('pointerup', e => {
  if (!tp || tp.id !== e.pointerId) return;
  const ok = Math.hypot(e.clientX - tp.x, e.clientY - tp.y) < 10 && Date.now() - tp.t < 600; tp = null;
  if (ok && phone.classList.contains('kb')) typeNext();
});

// 戻るボタン長押し（0.8秒）で最初から
const back = $('cBack');
let lp = null;
back.addEventListener('pointerdown', e => { e.stopPropagation(); back.classList.add('down'); lp = setTimeout(() => location.reload(), 800); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => back.addEventListener(t, () => { back.classList.remove('down'); clearTimeout(lp); }));

/* ---- 撮影事故防止 ---- */
const nope = e => e.preventDefault();
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'selectstart', 'contextmenu', 'dragstart'].forEach(t => document.addEventListener(t, nope, { passive: false }));
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('.c-list')) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ---- 起動 ---- */
renderInput();
layout(); toBottom();
window.addEventListener('resize', () => { layout(); });
window.addEventListener('orientationchange', () => setTimeout(layout, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
window.addEventListener('pageshow', layout);
[100, 400, 1000].forEach(ms => setTimeout(() => { layout(); toBottom(); }, ms));
})();
</script>
</body>
</html>
